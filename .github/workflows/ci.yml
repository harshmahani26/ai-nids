name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight test deps only - we don't need PyTorch/CatBoost/SHAP for CI tests.
          pip install scikit-learn pandas numpy matplotlib seaborn xgboost lightgbm pytest ruff

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (data + preprocess + tree-model smoke tests)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_preprocess.py tests/test_models.py -k "not cnn_smoke"
